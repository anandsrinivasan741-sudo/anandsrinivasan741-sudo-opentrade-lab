[project]
name = "opentrade-backend"
version = "0.1.0"
description = "Research-only market analysis backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
